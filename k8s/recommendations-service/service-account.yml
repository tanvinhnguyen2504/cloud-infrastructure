apiVersion: v1
kind: ServiceAccount
metadata:
  name: recommendations-service
  namespace: recommendations
  annotations:
    # Binds this KSA to the GSA that holds roles/cloudsql.client. The pair must
    # also be bound the other way (roles/iam.workloadIdentityUser on the GSA),
    # or the proxy gets a token for the node SA instead and Cloud SQL rejects it.
    # Service-specific, not shared with auth-sql: one identity per workload keeps
    # a future grant to one service from widening the other.
    iam.gke.io/gcp-service-account: recommendations-sql@vincent-mini-apps-project.iam.gserviceaccount.com
