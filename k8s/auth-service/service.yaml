apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: auth
spec:
  # Phase 1 only. Phase 2 switches this to NodePort and puts a GKE Ingress with
  # a managed certificate in front, because Google OAuth needs a real hostname.
  type: LoadBalancer
  selector:
    app: auth-service
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
