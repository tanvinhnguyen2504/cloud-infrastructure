apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: recommendations

resources:
  - namespace.yaml
  - service-account.yml
  - configmap.yaml
  - deployment.yaml
  - service.yaml

# recommendations-service-secrets is deliberately NOT here. It is created
# imperatively (docs/recommendations-service/deploy.md step 5) so that no
# credential ever lands in this repository.

labels:
  # includeSelectors must stay false: true would inject these into the immutable
  # selector.matchLabels.
  - includeSelectors: false
    pairs:
      app.kubernetes.io/name: recommendations-service
      app.kubernetes.io/part-of: mini-apps
