apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: auth

resources:
  - namespace.yaml
  - service-account.yml
  - configmap.yaml
  - deployment.yaml
  - service.yaml

# auth-service-secrets is deliberately NOT here. It is created imperatively with
# `kubectl create secret` (see docs/phase-1-deploy.md) so that no credential ever
# lands in this repository.

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/name: auth-service
      app.kubernetes.io/part-of: mini-apps
